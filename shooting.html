<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maman cochonne</title>
    <style>
        /* Styles de base pour rendre la page élégante */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        #content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        header h1 {
            color: #FFB6C1; /* Couleur Rose Clair */
            font-size: 2.5em;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            color: #aaa;
            font-size: 1.1em;
            margin: 0;
        }

        /* Grille de la galerie */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Cartes photo */
        .photo-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            border-color: #FFB6C1; /* Accentuation au survol */
        }

        /* Conteneur de l'image */
        .photo-wrapper {
            position: relative;
            width: 100%;
            height: 320px;
            overflow: hidden;
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Badge de prix superposé sur l'image */
        .price-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: rgba(18, 18, 18, 0.85);
            color: #FFB6C1;
            border: 1px solid #FFB6C1;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            backdrop-filter: blur(4px);
        }

        /* Description sous l'image */
        .photo-info {
            padding: 15px;
            text-align: center;
        }

        .photo-info h3 {
            color: #ffffff;
            font-size: 1.2em;
            margin: 0 0 8px 0;
        }

        /* Bouton de commande */
        .btn-order {
            display: inline-block;
            background-color: transparent;
            color: #FFB6C1;
            border: 1px solid #FFB6C1;
            padding: 8px 16px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .btn-order:hover {
            background-color: #FFB6C1;
            color: #121212;
        }
    </style>
</head>
<body>

    <div id="content">
        <header>
            <h1>Photo pros</h1>
            <p>Galerie exclusive & modèles</p>
        </header>

        <main class="gallery-grid">

            <!-- Photo 1 -->
            <div class="photo-card">
                <div class="photo-wrapper">
                    <img src="Shooting002.png" alt="Modèle 1">
                </div>
            </div>

            <!-- Photo 2 -->
            <div class="photo-card">
                <div class="photo-wrapper">
                    <img src="Shooting003.png" alt="Modèle 2">
                                </div>
                         </div>

            <!-- Photo 3 -->
            <div class="photo-card">
                <div class="photo-wrapper">
                    <img src="modele3.jpg" alt="Modèle 3">
                </div>
                <div class="photo-info">
                    <h3>Modèle #3</h3>
                    <a href="modele3.html" class="btn-order">Voir le modèle</a>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
