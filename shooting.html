<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maman cochonne</title>
    <style>
        /* Styles de base pour rendre la page élégante */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        #content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        header h1 {
            color: #FFB6C1; /* Couleur Rose Clair */
            font-size: 2.5em;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            color: #aaa;
            font-size: 1.1em;
            margin: 0;
        }

        /* Grille de la galerie */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Cartes photo */
        .photo-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            cursor: pointer; /* Ajout d'un curseur main pour indiquer que c'est cliquable */
        }

        .photo-card:hover {
            transform: translateY(-5px);
            border-color: #FFB6C1; /* Accentuation au survol */
        }

        /* Conteneur de l'image */
        .photo-wrapper {
            position: relative;
            width: 100%;
            height: 320px;
            overflow: hidden;
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Badge de prix superposé sur l'image */
        .price-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: rgba(18, 18, 18, 0.85);
            color: #FFB6C1;
            border: 1px solid #FFB6C1;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            backdrop-filter: blur(4px);
        }

        /* Description sous l'image */
        .photo-info {
            padding: 15px;
            text-align: center;
        }

        .photo-info h3 {
            color: #ffffff;
            font-size: 1.2em;
            margin: 0 0 8px 0;
        }

        /* Bouton de commande */
        .btn-order {
            display: inline-block;
            background-color: transparent;
            color: #FFB6C1;
            border: 1px solid #FFB6C1;
            padding: 8px 16px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .btn-order:hover {
            background-color: #FFB6C1;
            color: #121212;
        }

        /* --- STYLES DE LA LIGHTBOX (AGRANDISSEMENT) --- */
        
        /* Conteneur principal invisible par défaut */
        #lightbox {
            display: none; /* Caché par défaut */
            position: fixed;
            z-index: 1000; /* Par-dessus tout */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); /* Fond noir transparent */
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Empêche le défilement de la page derrière */
        }

        /* L'image agrandie elle-même */
        #lightbox-img {
            max-width: 90%;
            max-height: 90%;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            object-fit: contain; /* Garde les proportions sans couper */
        }

        /* Bouton pour fermer */
        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #e0e0e0;
            font-size: 40px;
            font-weight: bold;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        #lightbox-close:hover {
            color: #FFB6C1;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div id="content">
        <header>
            <h1>Photo pros</h1>
            <p>Galerie exclusive & modèles</p>
        </header>

        <main class="gallery-grid">

            <!-- Photo 1 -->
            <div class="photo-card">
                <div class="photo-wrapper">
                    <!-- J'ai ajouté une classe 'gallery-img' ici -->
                    <img src="Shooting002.png" alt="Modèle 1" class="gallery-img">
                </div>
            </div>

            <!-- Photo 2 -->
            <div class="photo-card">
                <div class="photo-wrapper">
                    <!-- J'ai ajouté une classe 'gallery-img' ici -->
                    <img src="Shooting003.png" alt="Modèle 2" class="gallery-img">
                </div>
            </div>

        </main>
    </div>

    <!-- --- STRUCTURE HTML DE LA LIGHTBOX --- -->
    <div id="lightbox">
        <span id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Image agrandie">
    </div>

    <!-- --- SCRIPT JAVASCRIPT --- -->
    <script>
        // Sélection des éléments
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxClose = document.getElementById('lightbox-close');
        const galleryImages = document.querySelectorAll('.gallery-img');

        // Pour chaque image de la galerie
        galleryImages.forEach(image => {
            image.addEventListener('click', () => {
                // 1. Récupérer la source de l'image cliquée
                const imageSrc = image.getAttribute('src');
                // 2. Mettre cette source dans l'image de la lightbox
                lightboxImg.setAttribute('src', imageSrc);
                // 3. Afficher la lightbox (en flex pour centrer)
                lightbox.style.display = 'flex';
                // 4. Empêcher le scroll de la page principale
                document.body.style.overflow = 'hidden';
            });
        });

        // Fermer la lightbox quand on clique sur le 'X'
        lightboxClose.addEventListener('click', () => {
            lightbox.style.display = 'none';
            document.body.style.overflow = 'auto'; // Rétablir le scroll
        });

        // Fermer aussi quand on clique n'importe où sur le fond noir
        lightbox.addEventListener('click', (e) => {
            // S'assurer qu'on n'a pas cliqué sur l'image elle-même
            if (e.target !== lightboxImg) {
                lightbox.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        });
        
        // Fermer avec la touche 'Echap'
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.style.display === 'flex') {
                lightbox.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        });

    </script>

</body>
</html>
