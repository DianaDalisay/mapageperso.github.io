<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos & Vidéos - Diana</title>
    <style>
        /* Styles de base cohérents avec le reste du site */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        #content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Bouton de retour à l'accueil */
        .btn-back {
            display: inline-block;
            margin-bottom: 25px;
            color: #FFB6C1;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95em;
            padding: 8px 16px;
            border: 1px solid #FFB6C1;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: #FFB6C1;
            color: #121212;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        header h1 {
            color: #FFB6C1;
            font-size: 2.3em;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            color: #aaa;
            margin: 0;
        }

        /* Grille de la galerie */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        /* Cartes de la galerie */
        .gallery-item {
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            border-color: #FFB6C1;
        }

        .gallery-item img, 
        .gallery-item video {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        /* Badge pour identifier les vidéos */
        .badge-video {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: rgba(0, 0, 0, 0.75);
            color: #FFB6C1;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            border: 1px solid #FFB6C1;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .item-caption {
            padding: 12px 15px;
            background-color: #1e1e1e;
            font-size: 0.95em;
            color: #ccc;
            text-align: center;
            border-top: 1px solid #2a2a2a;
        }
    </style>
</head>
<body>

    <div id="content">

        <!-- Bouton retour -->
        <a href="index.html" class="btn-back">← Retour à l'accueil</a>

        <header>
            <h1>Galerie Photos & Vidéos</h1>
            <p>Découvrez mes photos pros et celles un plus amatrices...</p>
        </header>

        <main>
            <div class="gallery-grid">

                <!-- Photo 1 -->
                <div class="gallery-item">
                    <img src="Diana_002.PNG" alt="Diana Photo 1">
                    <div class="item-caption">Un petit sourire pour commencer 😊</div>
                </div>

                <!-- Photo 2 -->
                <div class="gallery-item">
                    <img src="Diana_003.png" alt="Diana Photo 2">
                    <div class="item-caption">Session shooting relax ✨</div>
                </div>

                <!-- Vidéo 1 -->
                <div class="gallery-item">
                    <span class="badge-video">▶ Vidéo</span>
                    <!-- Remplacez video_01.mp4 par le nom de votre fichier vidéo -->
                    <video controls poster="Diana_001.png">
                        <source src="bedrrom001.mp4" type="video/mp4">
                        Votre navigateur ne supporte pas la lecture de vidéos.
                    </video>
                    <div class="item-caption">Petit coucou en vidéo ! 🎥</div>
                </div>

                <!-- Photo 3 -->
                <div class="gallery-item">
                    <img src="Diana_004.png" alt="Diana Photo 3">
                    <div class="item-caption">Aperçu de mes tenues préférées 👗</div>
                </div>

            </div>
        </main>

    </div>

</body>
</html>
