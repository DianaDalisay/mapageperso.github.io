<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maman cochonne</title>
    <style>
        /* Styles de base pour rendre la page élégante */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        #content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        header h1 {
           color: #FFB6C1; /* Couleur Rose Clair */
            font-size: 2.5em;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Message de bienvenue */
        .welcome-box {
            background-color: #1a1a1a;
            border-left: 4px solid #FFB6C1;
            padding: 20px;
            margin-bottom: 40px;
            border-radius: 4px;
            text-align: center;
        }

        .welcome-box p {
            margin: 10px 0;
            font-size: 1.1em;
        }

        .hostess-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            max-height: 500px;
            object-fit: cover;
        }

        /* Grille pour la présentation des modèles */
        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        /* Carte de chaque modèle */
        .model-card {
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            border: 1px solid #222;
        }

        .model-card:hover {
            transform: translateY(-5px);
            border-color: #FFB6C1;
        }

        .model-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        .model-name {
            padding: 15px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            background-color: #222;
            margin: 0;
            border-top: 1px solid #333;
        }
    </style>
</head>

            <br>Bisous, Diana</p>
        </div>
